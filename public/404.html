<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f3efe8" />
    <title>Page not found · Mydrobe</title>
    <!-- Served by the host for any path that isn't a page or a file, so it can't rely on the app's built styles. -->
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        background: #f6f1ec;
        color: #4a2d1f;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .brand {
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1.75rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #6f6257;
      }
      a.home {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        border-radius: 999px;
        background: #4a2d1f;
        color: #f6f1ec;
        text-decoration: none;
        font-weight: 500;
      }
      a.home:hover,
      a.home:focus-visible {
        background: #5b3a28;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Mydrobe</div>
      <h1>Page not found</h1>
      <p>There's nothing at this address.</p>
      <a class="home" href="/">Go to Mydrobe</a>
    </main>
  </body>
</html>
